# What exists under the data root; layout is in data/README.md.
# mot/ holds every sequence in `splits`; `dets` and `recon` name the sequences
# that have dets/<seq>.txt and recon/<seq>/, and `landmarks` maps a sequence to the
# mapping backends it has landmarks from, as landmarks/<seq>/<backend>.npz.

lettucemots:
  splits:
    test: ["0003", "0007", "0011"]
    train: ["0000", "0001", "0002", "0004", "0005", "0006", "0008", "0009", "0010"]
  dets: ["0000", "0001", "0002", "0003", "0004", "0005", "0006", "0007", "0008", "0009", "0010", "0011"]
  landmarks:
    "0011": ["sfm"]
  recon: ["0011"]

# Only V01 is downloaded; upstream ships V01-V12, all as `test`.
moranget:
  splits:
    test: ["V01"]
  dets: ["V01"]
  landmarks:
    V01: ["sfm"]
  recon: ["V01"]

# Upstream ships every sequence as test.
grapemots:
  splits:
    test: ["PathPlanning_1", "PathPlanning_2", "PathPlanning_7"]
  dets: ["PathPlanning_1", "PathPlanning_2", "PathPlanning_7"]
  landmarks:
    PathPlanning_1: ["sfm"]
    PathPlanning_2: ["sfm"]
    PathPlanning_7: ["sfm"]
  recon: ["PathPlanning_1", "PathPlanning_2", "PathPlanning_7"]

# testing 0011 and 0012 repeat 0007 and 0008 (same masks, locally edited pixels).
applemots:
  splits:
    test: ["0006", "0007", "0008", "0010", "0011", "0012"]
    train: ["0000", "0001", "0002", "0003", "0004", "0005"]
  dets: ["0006", "0007", "0008", "0010", "0011", "0012"]
  landmarks:
    "0006": ["sfm"]
    "0007": ["sfm"]
    "0008": ["sfm"]
    "0010": ["sfm"]
    "0011": ["sfm"]
    "0012": ["sfm"]
  recon: ["0000", "0001", "0002", "0003", "0004", "0005", "0006", "0007", "0008", "0010", "0011", "0012"]
