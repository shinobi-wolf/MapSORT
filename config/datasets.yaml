# What exists under the data root; layout is in data/README.md.
# mot/ holds every sequence in `splits`; `dets` and `recon` name the sequences
# that have dets/<seq>.txt and recon/<seq>/, and `landmarks` maps a sequence to the
# mapping backends it has landmarks from, as landmarks/<seq>/<backend>.npz.

lettucemots:
  splits:
    test: ["0003", "0007", "0011"]
    train: ["0000", "0001", "0002", "0004", "0005", "0006", "0008", "0009", "0010"]
  dets: ["0000", "0001", "0002", "0003", "0004", "0005", "0006", "0007", "0008", "0009", "0010", "0011"]
  landmarks:
    "0011": ["sfm"]
  recon: ["0011"]

# Only V01 is downloaded; upstream ships V01-V12, all as `test`.
moranget:
  splits:
    test: ["V01"]
  dets: ["V01"]
  landmarks:
    V01: ["sfm"]
  recon: ["V01"]

# Only PathPlanning_7 is unzipped and reconstructed; PathPlanning_1 and _2 are still zips.
grapemots:
  splits:
    test: ["PathPlanning_7"]
  dets: ["PathPlanning_7"]
  landmarks:
    PathPlanning_7: ["sfm"]
  recon: ["PathPlanning_7"]
