# The single MapSORT configuration: how a run is invoked, what the pipeline is
# made of, and how its results are scored.
#
#   run       defaults for every `mapsort` flag; any flag overrides its key
#   pipeline  constructor arguments for each pipeline module
#   protocol  the frozen scoring protocol -- how results are scored, never which
#
# Paths are relative to the repo root.

run:
  dataset: lettucemots
  split: test
  seqs: ["0011"]  # null = the whole split
  detections: stored  # stored | live
  landmarks: sfm  # null = none; a backend name loads landmarks/<seq>/<backend>.npz
  limit: null  # frames per sequence; null = all
  task_id: null
  eval: true
  save: true  # false = --no-save
  viz: false
  viz_compare: true
  viz_save: overlay.mp4  # mp4 path

pipeline:
  detector:
    # Stock yolov8n is COCO-trained and detects nothing in the crop datasets;
    # replace with weights fine-tuned on the target crop.
    weights: yolov8n.pt
    conf: 0.25
    device: null  # null lets ultralytics pick; "cpu", "0", "cuda:0" to pin

  mapping: {}  # stub — returns no landmarks until the CUT3R module lands

  tracker:
    # -> boxmot BotSortConfig; MapSORT keeps BoT-SORT's own association as its first stage
    botsort: {}

    # -> MapSort's landmark stages; enabled: false is plain BoT-SORT
    landmarks:
      enabled: true
      gate: 200  # squared Mahalanobis: camera correspondences, and revival when no camera is found
      short_gate: 10  # the same against a lost track's latest observation, when no camera is found
      reprojection: 1.0  # revival gate on reprojection error, in box sizes; null = landmark gate only
      camera:
        # RANSAC DLT on matched tracks' landmarks and box centres, one camera per frame
        iters: 300
        inlier: 0.5  # box sizes
        min_inliers: 8
        seed: 0
      map_motion:
        # a reliable track is placed where the camera projects its landmark, plus its learned offset
        enabled: true
        min_offsets: 2
        max_residual: 0.3  # box sizes
        alpha: 0.3
      dormancy:
        # lets a revisit longer than BoT-SORT's track buffer reclaim its id
        enabled: true
        max_dormant: null  # null = unbounded

    # -> boxmot ReIDConfig
    reid:
      model: osnet-x0-25-msmt17
      device: null
      precision: null  # fp16 | fp32
      batch_size: null
      allow_download: true

protocol:
  tracking:
    # IoU thresholds for CLEAR/Identity; primary keeps plain names, others are
    # suffixed (MOTA, MOTA@0.25). HOTA takes no threshold.
    thresholds: [0.5, 0.25]
    primary_threshold: 0.5
    # Single-class crop data: preprocessing would only filter rows silently.
    do_preproc: false

  # Revisit-restricted identity metrics (mapsort/eval/revisit.py).
  revisit:
    min_gap: 10  # frames absent before a return counts as a revisit
    grace: 5  # frames allowed to re-acquire; StrongSORT needs n_init=3 hits to confirm
    window: 30  # frames after each reappearance in the `restricted` metrics
