[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localizesort"
version = "0.1.0"
description = "Online multi-object tracking of stationary objects from monocular RGB video, with online feed-forward localization replacing offline SfM (RLoc)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "ultralytics>=8.3.0",
    "pyyaml",
    "scipy",
    # TrackEval is deliberately not declared here. Its metadata demands
    # numpy>=2.3 while this project pins 1.26 for torch and CUT3R, so pip would
    # upgrade numpy and break them; the code itself is fine on 1.26. Install it
    # separately: pip install --no-deps trackeval==1.3.0 tabulate
]

[project.scripts]
# The run workflow is the entry point; `--eval` scores the result in place.
localizesort = "localizesort.run:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["localizesort*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# This machine's ROS2 setup leaks its site-packages onto PYTHONPATH for every
# Python process, including venvs/conda envs. pytest then autoloads ROS's
# `launch_testing` pytest plugin, which is incompatible with this pytest
# version and crashes on collection. It's unrelated to this project, so
# disable it explicitly rather than relying on plugin autoload being off.
addopts = "-p no:launch_testing -p no:launch_ros"
